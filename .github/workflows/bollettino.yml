name: Bollettino CommandChatGPT

on:
  schedule:
    # GitHub usa UTC. Le quattro finestre consentono di mantenere le 11 e le 23 italiane
    # sia in ora solare sia in ora legale; il controllo locale evita doppie edizioni.
    - cron: '0 9 * * *'
    - cron: '0 10 * * *'
    - cron: '0 21 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: commandchatgpt-bollettino
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verifica finestra oraria italiana
        id: schedule_guard
        if: github.event_name == 'schedule'
        run: |
          HOUR=$(TZ=Europe/Rome date +%H)
          if [ "$HOUR" = "11" ] || [ "$HOUR" = "23" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Edizione prevista: ora locale $HOUR"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Fuori dalla finestra italiana prevista: ora locale $HOUR. Nessuna edizione generata."
          fi
      - name: Genera bollettino e storico
        if: github.event_name != 'schedule' || (steps.schedule_guard.outputs.run == 'true')
        run: python scripts/generate_bollettino.py
      - name: Salva bollettino e archivio
        if: github.event_name != 'schedule' || (steps.schedule_guard.outputs.run == 'true')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bollettino.json data/bollettino_storico.json
          if git diff --cached --quiet; then echo "Nessuna variazione da salvare"; exit 0; fi
          cp data/bollettino.json "$RUNNER_TEMP/bollettino.json"
          cp data/bollettino_storico.json "$RUNNER_TEMP/bollettino_storico.json"
          git commit -m "Aggiorna bollettino CommandChatGPT"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/bollettino.json" data/bollettino.json
            cp "$RUNNER_TEMP/bollettino_storico.json" data/bollettino_storico.json
            git add data/bollettino.json data/bollettino_storico.json
            git commit -m "Aggiorna bollettino CommandChatGPT"
            sleep 5
          done
          exit 1
      - name: Configura GitHub Pages
        if: github.event_name != 'schedule' || (steps.schedule_guard.outputs.run == 'true')
        uses: actions/configure-pages@v5
      - name: Prepara sito
        if: github.event_name != 'schedule' || (steps.schedule_guard.outputs.run == 'true')
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp -r data/. _site/data/
      - name: Carica sito
        if: github.event_name != 'schedule' || (steps.schedule_guard.outputs.run == 'true')
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Pubblica bollettino
        if: github.event_name != 'schedule' || (steps.schedule_guard.outputs.run == 'true')
        id: deployment
        uses: actions/deploy-pages@v4
